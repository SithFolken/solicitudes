<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba ExcelJS - Excel con Colores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
</head>
<body class="bg-light p-5">
    <div class="container text-center">
        <h2 class="mb-4">🧪 Prueba ExcelJS - Excel con Colores</h2>
        <button class="btn btn-success btn-lg" onclick="generarExcelConExcelJS()">
            Descargar Excel con Colores
        </button>
        <div id="mensaje" class="mt-4 text-success fw-bold" style="display: none;">
            ✅ ¡Archivo descargado! Ábrelo y revisa los colores.
        </div>
    </div>

    <script>
        async function generarExcelConExcelJS() {
            const workbook = new ExcelJS.Workbook();
            
            // ==========================================
            // HOJA 1: TRANSFERENCIA (Verde)
            // ==========================================
            const ws1 = workbook.addWorksheet('TRANSFERENCIA');
            ws1.columns = [
                { header: 'TIENDA', key: 'tienda', width: 10 },
                { header: 'CODIGO', key: 'codigo', width: 12 },
                { header: 'DIGITO', key: 'digito', width: 8 },
                { header: 'CANTIDAD', key: 'cantidad', width: 10 },
                { header: 'MENSAJE', key: 'mensaje', width: 10 }  // ✅ Cambiado de "R:" a "MENSAJE"
            ];
            
            // ✅ Aplicar estilo SOLO a las celdas del encabezado (A1:E1), no a toda la fila
            const encabezadoVerde = {
                font: { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 },
                fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF28A745' } },
                alignment: { horizontal: 'center' }
            };
            
            for (let i = 1; i <= 5; i++) {
                ws1.getCell(1, i).font = encabezadoVerde.font;
                ws1.getCell(1, i).fill = encabezadoVerde.fill;
                ws1.getCell(1, i).alignment = encabezadoVerde.alignment;
            }
            
            // Datos (con "R:" en la columna MENSAJE)
            ws1.addRow({ tienda: 96, codigo: '123456', digito: '7', cantidad: 50, mensaje: 'R:' });
            ws1.addRow({ tienda: 96, codigo: '987654', digito: '3', cantidad: 120, mensaje: 'R:' });
            
            // ==========================================
            // HOJA 2: CROSS DOCKING (Azul)
            // ==========================================
            const ws2 = workbook.addWorksheet('CROSS DOCKING');
            ws2.columns = [
                { header: 'TIENDA', key: 'tienda', width: 10 },
                { header: 'SKU', key: 'sku', width: 12 },
                { header: 'CANTIDAD', key: 'cantidad', width: 10 }
            ];
            
            const encabezadoAzul = {
                font: { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 },
                fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF007BFF' } },
                alignment: { horizontal: 'center' }
            };
            
            for (let i = 1; i <= 3; i++) {
                ws2.getCell(1, i).font = encabezadoAzul.font;
                ws2.getCell(1, i).fill = encabezadoAzul.fill;
                ws2.getCell(1, i).alignment = encabezadoAzul.alignment;
            }
            
            ws2.addRow({ tienda: 96, sku: '1112223', cantidad: 30 });
            ws2.addRow({ tienda: 96, sku: '4445556', cantidad: 80 });
            
            // ==========================================
            // HOJA 3: COMPRA LOCAL (Naranja)
            // ==========================================
            const ws3 = workbook.addWorksheet('COMPRA LOCAL');
            ws3.columns = [
                { header: 'SKU', key: 'sku', width: 12 },
                { header: 'CANTIDAD', key: 'cantidad', width: 10 },
                { header: 'FECHA SOLICITUD', key: 'f_solicitud', width: 15 },
                { header: 'FECHA RECEPCION', key: 'f_recepcion', width: 15 },
                { header: 'FECHA CANCELACION', key: 'f_cancel', width: 15 },
                { header: 'TIENDA', key: 'tienda', width: 10 },
                { header: 'ID PROVEEDOR', key: 'id_prov', width: 12 }
            ];
            
            const encabezadoNaranja = {
                font: { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 },
                fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFD7E14' } },
                alignment: { horizontal: 'center' }
            };
            
            for (let i = 1; i <= 7; i++) {
                ws3.getCell(1, i).font = encabezadoNaranja.font;
                ws3.getCell(1, i).fill = encabezadoNaranja.fill;
                ws3.getCell(1, i).alignment = encabezadoNaranja.alignment;
            }
            
            const hoy = new Date();
            ws3.addRow({ 
                sku: '7778889', 
                cantidad: 200, 
                f_solicitud: hoy.toISOString().split('T')[0],
                f_recepcion: new Date(hoy.getTime() + 5*24*60*60*1000).toISOString().split('T')[0],
                f_cancel: new Date(hoy.getTime() + 8*24*60*60*1000).toISOString().split('T')[0],
                tienda: 96, 
                id_prov: 1050 
            });
            
            // Descargar
            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'PRUEBA_EXCELJS_CORREGIDO.xlsx';
            a.click();
            
            document.getElementById('mensaje').style.display = 'block';
        }
    </script>
</body>
</html>
